<!doctype html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="robots" content="noindex">
<title>ADPRO · penghitung</title>
</head>
<body>
<!-- Halaman kecil tanpa tampilan (31 Okt 2026).
     Dibuka diam-diam oleh aplikasi admin ProjekGo untuk menampilkan angka merah di menu Katalog.
     Memakai login ADPRO yang sudah tersimpan di browser; hanya MENGHITUNG (tidak membaca isi data),
     lalu mengirim satu angka ke aplikasi admin di domain projekgo.id. Tidak login = tidak mengirim apa-apa. -->
<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
import { getFirestore, collection, query, where, getDocs } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js";
import { getAuth, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-auth.js";

// 4 Nov 2026: ikut pindah ke proyek onbid bersama ADPRO.
const firebaseConfig = {
    apiKey: "AIzaSyBCp2PBN1ASET6QjuQ3PWdC1gysQv0z_OY",
    authDomain: "onbid-2f87a.firebaseapp.com",
    projectId: "onbid-2f87a",
    storageBucket: "onbid-2f87a.firebasestorage.app",
    messagingSenderId: "223888282484",
    appId: "1:223888282484:web:2fc05ed67ca1fab39e1221"
};

// Hanya berjalan di dalam aplikasi admin ProjekGo
const induk = (() => {
    try { return (location.ancestorOrigins && location.ancestorOrigins[0]) || (document.referrer ? new URL(document.referrer).origin : ''); } catch (e) { return ''; }
})();
const indukSah = window.parent !== window && /^https:\/\/([a-z0-9-]+\.)*projekgo\.id$/i.test(induk);

if (indukSah) {
    const app = initializeApp(firebaseConfig);
    const db = getFirestore(app);
    const auth = getAuth(app);
    // Sama seperti ADPRO: angka merah = data yang masuk SETELAH halamannya terakhir dibuka
    // (tanda waktunya disimpan ADPRO di perangkat ini). Data lama yang belum ditangani tetap
    // terlihat di Beranda ADPRO, tapi tidak membuat angka merah.
    const terakhirDilihat = (k) => {
        try {
            let v = Number(localStorage.getItem('ap_lihat_' + k));
            if (!v) { v = Date.now(); localStorage.setItem('ap_lihat_' + k, String(v)); }
            return v;
        } catch (e) { return 0; }
    };
    const waktuData = (x) => Number(x) || Date.parse(x || '') || (x && x.seconds ? x.seconds * 1000 : 0);
    const baruSejak = async (q, medanWaktu, k) => {
        const batas = terakhirDilihat(k);
        return (await getDocs(q)).docs.filter(d => waktuData(d.data()[medanWaktu]) > batas).length;
    };
    const henti = onAuthStateChanged(auth, async (u) => {
        henti();
        if (!u) return;
        try {
            const [ulasan, saran, daftar, pindah] = await Promise.all([
                baruSejak(query(collection(db, 'reviews'), where('status', '==', 'pending')), 'timestamp', 'ulasan'),
                baruSejak(query(collection(db, 'saran_masukan'), where('status', '==', 'baru')), 'timestamp', 'saran'),
                baruSejak(query(collection(db, 'pengajuan_mitra'), where('status', '==', 'Menunggu Tinjauan')), 'tanggal_pengajuan', 'daftar'),
                baruSejak(query(collection(db, 'pindah_gmail'), where('status', '==', 'menunggu')), 'dibuat_at', 'pindah')
            ]);
            const total = ulasan + saran + daftar + pindah;
            window.parent.postMessage({ jenis: 'adpro-lencana', total: total }, induk);
        } catch (e) { /* bukan akun admin katalog / tidak ada sinyal: diam saja */ }
    });
}
</script>
</body>
</html>
