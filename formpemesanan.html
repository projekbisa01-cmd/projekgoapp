<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Form Pemesanan - PROJEKGO</title>
    <!-- Tailwind CSS untuk Styling Modern -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- FontAwesome untuk Ikon -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    
    <style>
        body {
            font-family: 'Inter', sans-serif;
            background-color: #f0fdfa; /* Background tema bersih */
            background-image: radial-gradient(#cbd5e1 1px, transparent 1px);
            background-size: 20px 20px;
        }

        /* Animasi Mengambang untuk Teks PROJEKGO */
        .animate-float {
            animation: float 3s ease-in-out infinite;
        }

        @keyframes float {
            0% { transform: translateY(0px); }
            50% { transform: translateY(-6px); }
            100% { transform: translateY(0px); }
        }

        /* Menyembunyikan scrollbar agar tampilan benar-benar "Fit" dan bersih */
        .no-scrollbar::-webkit-scrollbar {
            display: none;
        }
        .no-scrollbar {
            -ms-overflow-style: none;
            scrollbar-width: none;
        }

        /* Styling kustom untuk scrollbar textarea */
        textarea::-webkit-scrollbar {
            width: 8px;
        }
        textarea::-webkit-scrollbar-track {
            background: #f1f1f1; 
            border-radius: 4px;
        }
        textarea::-webkit-scrollbar-thumb {
            background: #cbd5e1; 
            border-radius: 4px;
        }
        textarea::-webkit-scrollbar-thumb:hover {
            background: #94a3b8; 
        }
    </style>
</head>
<body class="h-[100dvh] w-full flex items-center justify-center p-2 sm:p-4 overflow-hidden">

    <!-- Overlay Tutup Operasional (Hanya muncul jika di luar jam kerja) -->
    <div id="overlayTutup" class="fixed inset-0 bg-gray-600 bg-opacity-90 z-50 flex items-center justify-center hidden backdrop-blur-sm">
        <div class="bg-white p-8 rounded-2xl shadow-xl max-w-sm w-full text-center mx-4 border-t-4 border-orange-500">
            <i class="fas fa-store-slash text-5xl text-gray-400 mb-4"></i>
            <h2 class="text-xl font-bold text-gray-800 mb-2">Mohon Maaf</h2>
            <p class="text-gray-600 text-sm leading-relaxed">
                Operasional kami saat ini <br>
                <span class="font-bold text-orange-500 text-base">06.30 - 21.00 WIB</span><br><br>
                Kami akan melayani kembali di jam tersebut yah kak 🙏
            </p>
        </div>
    </div>

    <!-- Card Container Utama -->
    <div class="bg-white max-w-md w-full h-full max-h-[100dvh] sm:max-h-[95dvh] rounded-2xl sm:rounded-3xl shadow-2xl flex flex-col overflow-hidden border border-gray-100">
        
        <!-- Bagian Header (Logo & Teks) -->
        <div class="bg-gradient-to-b from-teal-50 to-white pt-4 pb-3 px-4 flex flex-col items-center text-center flex-shrink-0">
            
            <!-- Logo -->
            <div class="relative">
                <div class="absolute inset-0 bg-orange-200 rounded-full blur-md opacity-50 animate-pulse"></div>
                <img src="https://i.ibb.co.com/995LzXCr/Whats-App-Image-2026-01-29-at-10-12-08.jpg" 
                     onerror="this.onerror=null; this.src='https://ui-avatars.com/api/?name=Projek+Go&background=f97316&color=fff&size=100&bold=true&rounded=true';" 
                     alt="Logo PROJEKGO" 
                     class="relative w-20 h-20 object-cover rounded-full border-2 border-white shadow-md z-10 bg-white">
            </div>

            <!-- Teks Animasi -->
            <h1 class="text-2xl font-extrabold text-orange-500 mt-2 tracking-tight animate-float">
                PROJEKGO
            </h1>
            
            <!-- Subteks -->
            <p class="text-[11px] sm:text-xs text-gray-500 font-medium italic lowercase tracking-wide mt-1 bg-gray-100 py-1 px-3 rounded-full">
                pesan proses langsung antar
            </p>
        </div>

        <!-- Bagian Form (Memiliki scroll internal tersembunyi jika HP sangat kecil) -->
        <div class="px-5 pb-4 overflow-y-auto no-scrollbar flex-1 flex flex-col justify-between">
            <form id="orderForm" onsubmit="kirimKeWhatsApp(event)" class="space-y-3">
                
                <!-- Field Atas Nama -->
                <div>
                    <label for="nama" class="block text-xs sm:text-sm font-semibold text-gray-700 mb-1">
                        Atas Nama <span class="text-red-500">*</span>
                    </label>
                    <div class="relative">
                        <div class="absolute inset-y-0 left-0 pl-3 flex items-center pointer-events-none">
                            <i class="fas fa-user text-gray-400 text-sm"></i>
                        </div>
                        <input type="text" id="nama" required
                            class="w-full pl-9 pr-3 py-2 text-sm bg-gray-50 border border-gray-200 rounded-xl focus:ring-2 focus:ring-teal-500 focus:border-teal-500 transition-all outline-none"
                            placeholder="Masukkan nama Anda">
                    </div>
                </div>

                <!-- Field Pesanan -->
                <div>
                    <label for="pesanan" class="block text-xs sm:text-sm font-semibold text-gray-700 mb-1">
                        Mau pesan apa kak list saja disini <span class="text-red-500">*</span>
                    </label>
                    <textarea id="pesanan" required rows="2"
                        class="w-full p-3 text-sm bg-gray-50 border border-gray-200 rounded-xl focus:ring-2 focus:ring-teal-500 focus:border-teal-500 transition-all outline-none resize-none"
                        placeholder="Contoh: Ayam Bakar Madu (2)"></textarea>
                </div>

                <!-- Field Alamat Pengantaran -->
                <div>
                    <label for="alamat" class="block text-xs sm:text-sm font-semibold text-gray-700 mb-1">
                        Mau diantar kemana <span class="text-red-500">*</span>
                    </label>
                    <div class="relative">
                        <div class="absolute top-2.5 left-0 pl-3 pointer-events-none">
                            <i class="fas fa-map-signs text-gray-400 text-sm"></i>
                        </div>
                        <textarea id="alamat" required rows="1"
                            class="w-full pl-9 pr-3 py-2 text-sm bg-gray-50 border border-gray-200 rounded-xl focus:ring-2 focus:ring-teal-500 focus:border-teal-500 transition-all outline-none resize-none"
                            placeholder="Detail alamat"></textarea>
                    </div>
                </div>

                <!-- Field Titik Maps -->
                <div class="p-3 bg-teal-50 border border-teal-100 rounded-xl flex flex-col items-center text-center">
                    <input type="hidden" id="maps" value="">
                    
                    <button type="button" id="btnLokasi" onclick="ambilLokasi()"
                        class="w-full flex flex-col items-center justify-center gap-1 bg-teal-600 hover:bg-teal-700 text-white font-medium py-2 px-3 rounded-lg transition-colors text-[11px] sm:text-xs shadow-sm leading-tight">
                        <i class="fas fa-map-marker-alt text-sm mb-0.5"></i>
                        <span>klik disini jika alamat tujuan antar,sama dengan lokasimu,</span>
                        <span>memudahkan rider dalam mengantar</span>
                    </button>
                </div>

                <!-- Tombol Kirim WhatsApp -->
                <button type="submit"
                    class="w-full flex items-center justify-center gap-2 bg-[#25D366] hover:bg-[#1ebd5a] text-white font-bold text-sm sm:text-base py-3 px-4 rounded-xl transition-transform transform hover:-translate-y-1 hover:shadow-lg mt-2">
                    <i class="fab fa-whatsapp text-xl"></i>
                    Kirim Pesanan Sekarang
                </button>
            </form>

            <!-- Banner Info Aplikasi -->
            <div class="mt-3 text-center border-t border-gray-100 pt-2 flex-shrink-0">
                <p class="text-[11px] sm:text-xs text-gray-600 leading-relaxed">
                    🎉 ProjekGo juga mempunyai aplikasi loh!<br>
                    <a href="https://katalog.projekgo.id" target="_blank" rel="noopener noreferrer" 
                       class="text-orange-500 font-bold hover:text-orange-600 hover:underline inline-block transition-colors">
                        Klik disini katalog.projekgo.id
                    </a>
                </p>
            </div>
        </div>
    </div>

    <!-- Script Logika Form -->
    <script>
        // Pengecekan Jam Operasional (06:30 - 21:00 WIB)
        function cekJamOperasional() {
            const now = new Date();
            // Ambil waktu saat ini, lalu paksa konversi ke WIB (UTC+7)
            const utc = now.getTime() + (now.getTimezoneOffset() * 60000);
            const wibTime = new Date(utc + (3600000 * 7));
            
            const jam = wibTime.getHours();
            const menit = wibTime.getMinutes();
            const totalMenit = (jam * 60) + menit;
            
            // Jam Buka: 06.30 = (6 * 60) + 30 = 390 menit
            // Jam Tutup: 21.00 = (21 * 60) = 1260 menit
            if (totalMenit < 390 || totalMenit > 1260) {
                // Tampilkan overlay dan matikan interaksi halaman
                document.getElementById('overlayTutup').classList.remove('hidden');
                document.body.style.overflow = 'hidden'; // Kunci scroll layar
            }
        }
        
        // Jalankan pengecekan saat web pertama dibuka
        window.onload = cekJamOperasional;

        // Fungsi untuk mengambil lokasi pengguna via GPS / Geolocation API
        function ambilLokasi() {
            const mapsInput = document.getElementById('maps');
            const btnLokasi = document.getElementById('btnLokasi');
            const ikonAwal = '<i class="fas fa-map-marker-alt text-sm mb-0.5"></i>';
            const teksTombol = '<span>klik disini jika alamat tujuan antar,sama dengan lokasimu,</span><span>memudahkan rider dalam mengantar</span>';

            if (navigator.geolocation) {
                // Ubah status tombol menjadi loading
                btnLokasi.innerHTML = '<i class="fas fa-spinner fa-spin text-sm mb-0.5"></i> <span>Sedang Mencari Lokasi...</span>';
                btnLokasi.classList.replace('bg-teal-600', 'bg-gray-500');
                btnLokasi.classList.replace('hover:bg-teal-700', 'hover:bg-gray-600');

                navigator.geolocation.getCurrentPosition(
                    // Jika sukses
                    function(position) {
                        const lat = position.coords.latitude;
                        const lng = position.coords.longitude;
                        // Format link Google Maps
                        mapsInput.value = `https://www.google.com/maps?q=${lat},${lng}`;
                        
                        // Ubah status tombol menjadi sukses
                        btnLokasi.innerHTML = '<i class="fas fa-check-circle text-sm mb-0.5"></i> <span>Titik Lokasi Didapatkan!</span>';
                        btnLokasi.classList.replace('bg-gray-500', 'bg-green-600');
                        btnLokasi.classList.replace('hover:bg-gray-600', 'hover:bg-green-700');
                        
                        // Kembalikan tombol seperti semula setelah 3 detik
                        setTimeout(() => {
                            btnLokasi.innerHTML = ikonAwal + teksTombol;
                            btnLokasi.classList.replace('bg-green-600', 'bg-teal-600');
                            btnLokasi.classList.replace('hover:bg-green-700', 'hover:bg-teal-700');
                        }, 3000);
                    },
                    // Jika error (ditolak atau tidak aktif)
                    function(error) {
                        btnLokasi.innerHTML = '<i class="fas fa-exclamation-triangle text-sm mb-0.5"></i> <span>Gagal Membaca Lokasi</span>';
                        btnLokasi.classList.replace('bg-gray-500', 'bg-red-500');
                        btnLokasi.classList.replace('hover:bg-gray-600', 'hover:bg-red-600');
                        
                        setTimeout(() => {
                            btnLokasi.innerHTML = ikonAwal + teksTombol;
                            btnLokasi.classList.replace('bg-red-500', 'bg-teal-600');
                            btnLokasi.classList.replace('hover:bg-red-600', 'hover:bg-teal-700');
                        }, 3000);
                    }
                );
            } else {
                // Fallback jika browser sangat usang
                btnLokasi.innerHTML = '<i class="fas fa-times text-sm mb-0.5"></i> <span>Browser Tidak Mendukung</span>';
                btnLokasi.classList.replace('bg-teal-600', 'bg-red-500');
            }
        }

        // Fungsi merangkai pesan dan mengarahkan ke WhatsApp
        function kirimKeWhatsApp(event) {
            // Mencegah form melakukan refresh halaman
            event.preventDefault();

            // Ambil semua data input
            const nama = document.getElementById('nama').value.trim();
            const pesanan = document.getElementById('pesanan').value.trim();
            const alamat = document.getElementById('alamat').value.trim();
            let maps = document.getElementById('maps').value.trim();

            // Jika Maps kosong, beri keterangan
            if (!maps) {
                maps = "- (Pemesan tidak menyertakan link maps)";
            }

            // Nomor tujuan (Pastikan awali dengan kode negara "62")
            const nomorAdmin = "6281292802623";

            // Rangkai teks template WhatsApp
            const teksPesan = `*Halo PROJEKGO, saya ingin memesan:*\n\n`
                            + `👤 *Atas Nama:*\n${nama}\n\n`
                            + `📝 *Daftar Pesanan:*\n${pesanan}\n\n`
                            + `🛵 *Alamat Pengantaran:*\n${alamat}\n\n`
                            + `📍 *Titik Maps:*\n${maps}`;

            // URL Encode text agar bisa dibaca browser/WA
            const encodePesan = encodeURIComponent(teksPesan);
            
            // Buat Link WA API
            const linkWA = `https://api.whatsapp.com/send?phone=${nomorAdmin}&text=${encodePesan}`;

            // Buka di tab baru (atau langsung ke aplikasi WA di HP)
            window.open(linkWA, '_blank');
        }
    </script>
</body>
</html>
